<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI廣瀬｜ボートレース払戻金結果</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:#0A1628;color:#fff;min-height:100vh;}
.top-bar{background:linear-gradient(135deg,#0A1628,#162d55);border-bottom:3px solid #D4AF37;padding:1.5rem 1rem;}
.top-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;justify-content:center;text-align:center;}
.pimg{width:80px;height:80px;border-radius:50%;border:3px solid #D4AF37;object-fit:cover;flex-shrink:0;}
.stitle{font-family:'Oswald',sans-serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:700;color:#D4AF37;}
.ssub{font-size:.85rem;color:#8A9BB5;margin-top:.3rem;}
.C{max-width:1000px;margin:0 auto;padding:1.5rem 1rem;}
.card{background:#0F2040;border:1px solid #162d55;border-radius:12px;padding:1.2rem;margin-bottom:1rem;}
.stl{font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:700;color:#D4AF37;margin-bottom:1rem;}
.dtabs{display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap;}
.dtab{background:#162d55;border:1px solid #1e3a6a;color:#8A9BB5;font-size:.82rem;padding:.4rem .9rem;border-radius:20px;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .2s;}
.dtab.active,.dtab:hover{background:#D4AF37;color:#0A1628;font-weight:700;}
.jg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.7rem;}
.jc{background:#162d55;border:1px solid #1e3a6a;border-radius:10px;padding:.8rem;text-align:center;cursor:pointer;transition:all .2s;}
.jc:hover,.jc.on{border-color:#D4AF37;background:#1e3a6a;}
.jn{font-weight:700;font-size:.92rem;}
.jcnt{font-size:.7rem;color:#8A9BB5;margin-top:.25rem;}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.7rem;margin-bottom:1rem;}
.sv{background:#162d55;border-radius:10px;padding:.8rem;text-align:center;}
.sn{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:#D4AF37;}
.sl{font-size:.7rem;color:#8A9BB5;margin-top:.2rem;}
.rt{width:100%;border-collapse:collapse;}
.rt th{font-size:.75rem;color:#8A9BB5;padding:.6rem .5rem;border-bottom:1px solid #162d55;text-align:left;}
.rt td{padding:.65rem .5rem;border-bottom:1px solid #0F2040;font-size:.88rem;}
.rt tr:hover td{background:rgba(212,175,55,.04);}
.km{font-family:'Oswald',sans-serif;font-size:1.1rem;color:#D4AF37;letter-spacing:1px;}
.rm{color:#FF8C00;font-weight:700;}
.rn{color:#2DC653;font-weight:700;}
.badge{display:inline-block;background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.35);color:#D4AF37;font-size:.72rem;font-weight:700;padding:.2rem .7rem;border-radius:12px;margin-bottom:.5rem;}
.note{font-size:.7rem;color:#8A9BB5;margin-top:.3rem;}
.mb{display:inline-block;background:rgba(255,140,0,.15);border:1px solid rgba(255,140,0,.4);color:#FF8C00;font-size:.65rem;font-weight:700;padding:.1rem .45rem;border-radius:7px;margin-left:.4rem;}
.ld{text-align:center;padding:2rem;color:#8A9BB5;}
.er{text-align:center;padding:1.5rem;color:#E63946;font-size:.85rem;}
</style>
</head>
<body>
<div class="top-bar">
  <div class="top-inner">
    <img src="https://masahiko.site/hirose1.jpg" alt="廣瀬雅彦" class="pimg">
    <div>
      <div style="font-size:.72rem;font-weight:700;letter-spacing:2px;color:#D4AF37;margin-bottom:.3rem">AI HIROSE PRESENTS</div>
      <div class="stitle">廣瀬雅彦<br>人生勝ち道方程式サイト！</div>
      <div class="ssub">ボートレース 払戻金結果 リアルタイム表示</div>
    </div>
  </div>
</div>

<div class="C">
  <div class="card">
    <div class="stl">📅 日付を選ぶ</div>
    <div class="dtabs" id="dtabs"></div>
    <div class="badge" id="badge">データ読み込み中...</div>
    <div class="note">※ BoatraceOpenAPI使用（約30分遅延）非公式データです</div>
  </div>

  <div class="card" id="jcard" style="display:none">
    <div class="stl">🏟️ 競艇場を選ぶ</div>
    <div class="jg" id="jgrid"></div>
  </div>

  <div class="card" id="rcard" style="display:none">
    <div class="stl">🏆 <span id="rtitle">払戻金結果</span></div>
    <div class="sg" id="sgrid"></div>
    <div id="rarea"></div>
  </div>
</div>

<script>
const JN={'01':'桐生','02':'戸田','03':'江戸川','04':'平和島','05':'多摩川','06':'浜名湖','07':'蒲郡','08':'常滑','09':'津','10':'三国','11':'びわこ','12':'住之江','13':'尼崎','14':'鳴門','15':'丸亀','16':'児島','17':'宮島','18':'徳山','19':'下関','20':'若松','21':'芦屋','22':'福岡','23':'唐津','24':'大村'};

let gData=null;

function buildTabs(){
  const el=document.getElementById('dtabs');
  const labels=['今日','昨日','2日前'];
  el.innerHTML=labels.map((lb,i)=>{
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const dp=`${d.getMonth()+1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`;
    return `<button class="dtab${i===1?' active':''}" onclick="load('${ds}','${dp}',this)">${lb} ${dp}</button>`;
  }).join('');
  // 昨日を初期ロード
  const y=new Date(); y.setDate(y.getDate()-1);
  const yd=y.getFullYear()+String(y.getMonth()+1).padStart(2,'0')+String(y.getDate()).padStart(2,'0');
  const yp=`${y.getMonth()+1}/${y.getDate()}`;
  load(yd,yp,null);
}

async function load(ds,dp,btn){
  if(btn){document.querySelectorAll('.dtab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');}
  gData=null;
  document.getElementById('badge').textContent=`${dp} のデータを取得中...`;
  document.getElementById('badge').style.color='';
  document.getElementById('jcard').style.display='none';
  document.getElementById('rcard').style.display='none';
  try{
    const yr=ds.substring(0,4);
    const r=await fetch(`https://boatraceopenapi.github.io/results/v3/${yr}/${ds}.json`);
    if(!r.ok) throw new Error(`${dp} のデータはまだありません`);
    gData=await r.json();
    buildJyo(gData,dp);
  }catch(e){
    document.getElementById('badge').textContent=e.message;
    document.getElementById('badge').style.color='#E63946';
  }
}

function buildJyo(data,dp){
  const res=data.results||[];
  const jm={};
  res.forEach(r=>{const j=String(r.race_stadium_number).padStart(2,'0');if(!jm[j])jm[j]=[];jm[j].push(r);});
  document.getElementById('badge').textContent=`${dp} — ${Object.keys(jm).length}場開催 / ${res.length}レース`;
  const g=document.getElementById('jgrid');
  g.innerHTML=Object.entries(jm).map(([j,rs])=>`<div class="jc" onclick="showR('${j}','${JN[j]||j}',this)"><div style="font-size:1.3rem;margin-bottom:.25rem">⛵</div><div class="jn">${JN[j]||j}</div><div class="jcnt">${rs.length}R</div></div>`).join('');
  document.getElementById('jcard').style.display='block';
}

function showR(jcd,name,el){
  document.querySelectorAll('.jc').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  if(!gData)return;
  const res=(gData.results||[]).filter(r=>String(r.race_stadium_number).padStart(2,'0')===jcd);
  document.getElementById('rtitle').textContent=`${name} の払戻金結果`;
  document.getElementById('rcard').style.display='block';
  document.getElementById('rcard').scrollIntoView({behavior:'smooth'});

  const rows=[];
  res.forEach(r=>{
    const rno=r.race_number;
    const pays=r.payoffs||r.race_payoffs||[];
    pays.forEach(p=>{
      const bm=p.betting_method||p.type||'';
      const bmn=p.betting_method_name||p.type_name||'';
      if(bm===8||bmn==='3連単'||bmn==='trifecta'||String(bm).includes('8')){
        rows.push({race:rno,km:p.combination||p.winning_combination||'—',ref:parseInt(p.payout||p.amount||0)});
      }
    });
    if(!pays.length){
      const top3=(r.race_results||[]).slice(0,3).map(x=>x.boat_number).join('-');
      rows.push({race:rno,km:top3||'—',ref:0});
    }
  });

  const mc=rows.filter(r=>r.ref>=10000).length;
  const mx=rows.length?Math.max(...rows.map(r=>r.ref)):0;
  const avg=rows.length?Math.round(rows.reduce((s,r)=>s+r.ref,0)/rows.length):0;

  document.getElementById('sgrid').innerHTML=`
    <div class="sv"><div class="sn">${rows.length}</div><div class="sl">レース数</div></div>
    <div class="sv"><div class="sn">${mc}</div><div class="sl">万舟券数</div></div>
    <div class="sv"><div class="sn">¥${mx.toLocaleString()}</div><div class="sl">最高払戻</div></div>
    <div class="sv"><div class="sn">¥${avg.toLocaleString()}</div><div class="sl">平均払戻</div></div>`;

  document.getElementById('rarea').innerHTML=`
    <table class="rt">
      <thead><tr><th>R</th><th>3連単</th><th>払戻金</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td style="color:#8A9BB5">${r.race}R</td>
        <td><span class="km">${r.km}</span>${r.ref>=10000?'<span class="mb">万舟🔥</span>':''}</td>
        <td><span class="${r.ref>=10000?'rm':'rn'}">${r.ref>0?'¥'+r.ref.toLocaleString():'—'}</span></td>
      </tr>`).join('')}</tbody>
    </table>`;
}

buildTabs();
</script>
</body>
</html>
